aid: nauto
name: Nauto
description: >-
  Nauto is a predictive AI platform for commercial fleet safety. Using in-vehicle
  AI dash cams and computer vision, it monitors driver behavior in real time,
  delivers predictive collision alerts before incidents occur, scores driver risk
  with its VERA system, and powers driver coaching, exoneration, and incident
  intelligence. Nauto also supports DVIR, IFTA, and ELD fleet-compliance workflows
  across trucking, delivery, construction, passenger transit, and field-service
  fleets. Backed by Greylock, Playground Global, and SoftBank Vision Fund, Nauto
  is SOC 2 Type 1/2 and ISO/IEC 27001:2022 certified.
